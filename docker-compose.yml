services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_test
      POSTGRES_PASSWORD: erp_test
      POSTGRES_DB: erp_test
    ports:
      - "5432:5432"
    volumes:
      - erp_test_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d

volumes:
  erp_test_postgres_data:
